<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I-78 VSL Scenarios</title>
<meta name="description" content="Operational scenario workbook for the I-78 variable speed limit study: data explorer, correlations, key scenarios and impact estimates.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{

  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#1c5cab; --o5:#0d366b;

    --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#b7d3f6;
    --o1:#184f95; --o2:#1c5cab; --o3:#2a78d6; --o4:#5598e7; --o5:#b7d3f6;
    --sevO:#7f8894; --sevC:#f6c553; --sevB:#f07a46; --sevA:#e0474f; --sevK:#ff8a94;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#262624; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --c0:#2c2c2a; --c1:#5598e7; --c2:#3987e5; --c3:#d95926; --c4:#d55181; --c5:#9085e9; --c6:#c9c2f5;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#b7d3f6;
  --o1:#184f95; --o2:#1c5cab; --o3:#2a78d6; --o4:#5598e7; --o5:#b7d3f6;
  --sevO:#7f8894; --sevC:#f6c553; --sevB:#f07a46; --sevA:#e0474f; --sevK:#ff8a94;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.35rem;font-weight:650}
@media (min-width:860px){ header.top h1{white-space:nowrap} }
h2{font-size:1.25rem;font-weight:650;margin-top:.2em}
h3{font-size:1.05rem;font-weight:650}
h4{font-size:.95rem;font-weight:650;color:var(--ink-2)}
p{margin:.3em 0 .8em}
small,.muted{color:var(--muted)}
code{font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.wrap{max-width:1380px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:1200;background:var(--page);border-bottom:1px solid var(--border);padding:10px 0 0}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 20px}
.top-row .title{flex:1 1 auto;min-width:0}
.top-row .chips{flex:0 1 auto;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;border:1px solid var(--border);background:var(--surface);color:var(--ink-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
button.chip{appearance:none;font:inherit;cursor:pointer}
button.chip:hover,button.chip:focus-visible{border-color:var(--accent);color:var(--ink);outline:none}
button.chip .more{color:var(--muted);font-size:.7rem}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:3000;display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--page);color:var(--ink);border:1px solid var(--border);border-radius:12px;max-width:960px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
.modal h2{margin:0 36px 4px 0;font-size:1.25rem}
.modal h4{margin:16px 0 6px}
.modal .close{position:absolute;top:10px;right:10px}
.modal .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.86rem;margin:8px 0}
.modal .kv b{color:var(--ink-2);font-weight:600}
.modal .grid.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.modal .stat .v{font-size:1.45rem}
@media (max-width:640px){ .modal{padding:14px} .modal-bg{padding:12px 8px} .modal .kv{grid-template-columns:1fr} }
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.critical{background:var(--critical)} .dot.neutral{background:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:6px}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:none;padding-top:18px}
.panel.active{display:block}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subtabs button{appearance:none;font:inherit;font-size:.88rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.subpanel{display:none} .subpanel.active{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2x{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
@media (min-width:760px){ .g2x{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:900px){ .g4{grid-template-columns:repeat(4,minmax(0,1fr))} }
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card.full{grid-column:1/-1}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-head h3{margin:0}
.card-head .sub{font-size:.85rem;color:var(--ink-2);margin-top:2px}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:none}
.toggle button{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;font-size:.78rem;padding:3px 9px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.15);border-radius:6px;padding:6px 9px;font-size:.78rem;line-height:1.35;white-space:nowrap;z-index:5;display:none}
.tip b{font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink-2);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:1.9rem;font-weight:650;line-height:1.1}
.stat .l{font-size:.85rem;color:var(--ink-2)}
.stat .n{font-size:.78rem;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th,table.t td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t th{color:var(--ink-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-scroll{max-height:420px;overflow:auto;border:1px solid var(--grid);border-radius:6px}
.tableview{display:none} .tableview.show{display:block}
.chartview.hide{display:none}
.await{border-style:dashed;background:transparent}
.await h3{display:flex;align-items:center;gap:8px}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);vertical-align:middle}
.badge.warn{background:rgba(250,178,25,.18);color:var(--ink)}
.badge.good{background:rgba(12,163,12,.15);color:var(--ink)}
.badge.crit{background:rgba(208,59,59,.14);color:var(--ink)}
ul.tight{margin:.2em 0 .6em 1.2em;padding:0} ul.tight li{margin:.15em 0}
.map{height:calc(100vh - 150px);min-height:520px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.map.fullscreen{position:fixed !important;inset:0;height:100vh;min-height:0;z-index:2500;border-radius:0;border:0} /* !important: Leaflet writes position:relative inline on its container */
#inrixwrap{display:none}
#inrixwrap.fullscreen{position:fixed;inset:0;height:100vh;min-height:0;z-index:2500;border-radius:0;border:0}
#inrixwrap iframe{width:100%;height:100%;border:0;display:block;background:var(--surface-2)}
.mapview .mapbtn[aria-pressed="true"]{border-color:var(--ink);font-weight:600;background:var(--surface-2)}
.mapbtn{appearance:none;font:inherit;font-size:.82rem;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.mapbtn:hover{border-color:var(--accent)}
.filters input[type=range]{width:110px;accent-color:var(--accent);vertical-align:middle}
.segpanel{margin-top:14px}
.segpanel .seghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
.segpanel .segstats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--ink-2);margin:4px 0 8px}
.segpanel .segstats b{color:var(--ink)}
.leaflet-container .leaflet-interactive{cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0 10px;font-size:.84rem;color:var(--ink-2)}
.filters label{display:inline-flex;align-items:center;gap:5px}
.filters select{font:inherit;font-size:.84rem;padding:3px 6px;border:1px solid var(--axis);border-radius:4px;background:var(--surface);color:var(--ink)}
.filters input[type=checkbox]{accent-color:var(--accent)}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.78rem;color:var(--ink-2);margin:8px 0 2px;align-items:center}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.maplegend i.sq{border-radius:2px;width:14px;height:8px}
.maplegend .ramp{display:inline-flex;gap:1px}
.maplegend .ramp i{border-radius:0;width:14px;height:10px}
.zone-label{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.72rem;font-weight:600;color:var(--ink);white-space:nowrap}
.rwis-label{background:var(--warn);color:#1a1a1a;border-radius:4px;padding:1px 5px;font-size:.7rem;font-weight:700;white-space:nowrap}
.stat-sig{color:var(--good);font-weight:600} .stat-ns{color:var(--muted)}
.leaflet-container{background:var(--surface-2)}
.leaflet-container{font:inherit}
.scen{border-left:4px solid var(--accent)}
.scen .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--ink-2);margin:4px 0 10px}
.scen .meta b{color:var(--ink)}
.steps{counter-reset:s;margin:.2em 0 .6em;padding:0;list-style:none}
.steps li{position:relative;padding-left:30px;margin:.3em 0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);font-size:.72rem;font-weight:650;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px}
.inputs label{display:flex;flex-direction:column;font-size:.8rem;color:var(--ink-2);gap:2px}
.inputs input,.inputs select{font:inherit;font-size:.9rem;padding:5px 7px;border:1px solid var(--axis);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem}
.kv b{font-variant-numeric:tabular-nums}
.note{font-size:.82rem;color:var(--ink-2);border-left:3px solid var(--warn);padding:4px 10px;background:var(--surface-2);border-radius:0 6px 6px 0;margin:.4em 0}
.finding{border-left:3px solid var(--accent);padding:4px 10px;margin:.4em 0;background:var(--surface-2);border-radius:0 6px 6px 0}
.zonebar{display:flex;gap:3px;margin:8px 0}
.zonebar div{flex:1;text-align:center;padding:8px 2px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-size:.78rem;line-height:1.2}
.zonebar div b{display:block;font-size:1.15rem}
.zonebar div.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zonebar div.step{background:var(--seq1)}
.themebtn{appearance:none;font:inherit;font-size:.8rem;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:4px 10px;cursor:pointer}
.inline-in{width:90px;font:inherit;padding:3px 6px;border:1px solid var(--axis);border-radius:4px;background:var(--surface);color:var(--ink)}
#errlog{display:none;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.75rem;color:var(--critical);padding:8px;border:1px solid var(--critical);border-radius:6px;margin-top:10px}
@media (max-width:640px){ .stat .v{font-size:1.5rem} .map{height:380px} }
@media print{ header.top{position:static} .panel{display:block!important} nav.tabs,.themebtn,.modal-bg{display:none} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="top-row">
    <div class="title">
      <h1>I-78 Variable Speed Limit: Scenario Workbook</h1>
      <div class="muted" id="subtitle"></div>
    </div>
    <div class="chips" id="status-chips"></div>
    <button class="themebtn" id="themebtn" type="button">Theme: auto</button>
  </div>
  <div class="modal-bg" id="ds-modal" role="dialog" aria-modal="true" aria-labelledby="ds-modal-title"><div class="modal"><button class="themebtn close" type="button" id="ds-modal-close" aria-label="Close">Close</button><div id="ds-modal-body"></div></div></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="data" aria-selected="true">1 · Data Explorer</button>
    <button role="tab" data-tab="map">2 · Map (all data)</button>
    <button role="tab" data-tab="corr">3 · Correlations &amp; Statistics</button>
    <button role="tab" data-tab="scen">4 · Key Scenarios</button>
    <button role="tab" data-tab="impact">5 · Potential Impact</button>
    <button role="tab" data-tab="method">6 · Method &amp; Sources</button>
  </nav>
</div></header>

<main class="wrap">
<div id="errlog"></div>

<section class="panel active" id="panel-data">
  <div class="subtabs" id="data-subtabs">
    <button data-sub="overview" aria-selected="true">Overview</button>
    <button data-sub="crash">Crash data</button>
    <button data-sub="tt">Travel times (INRIX)</button>
    <button data-sub="climate">Climate readings</button>
  </div>
  <div class="subpanel active" id="sub-overview"></div>
  <div class="subpanel" id="sub-crash"></div>
  <div class="subpanel" id="sub-tt"></div>
  <div class="subpanel" id="sub-climate"></div>
</section>
<section class="panel" id="panel-map"></section>
<section class="panel" id="panel-corr"></section>
<section class="panel" id="panel-scen"></section>
<section class="panel" id="panel-impact"></section>
<section class="panel" id="panel-method"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = /*__DATA__*/;
// Full-page INRIX map (I78_INRIX_Map.html) inlined by the build so tab 2 can embed it; null when not built.
const INRIX_MAP_SRC = /*__INRIX_MAP__*/null;
</script>
<script>
/* ------------------------------------------------------------------ */
/* Utilities                                                           */
/* ------------------------------------------------------------------ */
window.addEventListener('error', e => { const el = document.getElementById('errlog'); el.style.display='block'; el.textContent += (e.message||e) + ' @' + (e.lineno||'') + '\n'; });
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v!==null && v!==undefined) e.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k===null||k===undefined) continue; e.append(k.nodeType? k : document.createTextNode(String(k))); }
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function s(tag, attrs={}, ...kids){ const e=document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v); for (const k of kids.flat()){ if(k==null) continue; e.append(k.nodeType? k : document.createTextNode(String(k))); } return e; }
const fmt = (n, d=0) => (n===null||n===undefined||Number.isNaN(n)) ? '–' : Number(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (n, d=0) => (n===null||n===undefined) ? '–' : fmt(100*n, d)+'%';

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const C = DATA.climate, COR = DATA.corridor, CR = DATA.crashes, IX = DATA.inrix, X = DATA.cross || {};
const hasC = C && C.status==='loaded', hasCR = CR && CR.status==='loaded', hasIX = IX && IX.status==='loaded';
const CLS = (hasC && C.classes) || [];
const CLS_VAR = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6'];

const clsColor = i => css(CLS_VAR[i]);
const SEV = ['O','C','B','A','K'], SEV_LABEL={O:'No injury (O)',C:'Possible injury (C)',B:'Minor injury (B)',A:'Serious injury (A)',K:'Fatal (K)'}, SEV_VAR={O:'--o1',C:'--o2',B:'--o3',A:'--o4',K:'--o5'};
const py = hasC ? C.period.per_year : {};
const ST = hasCR ? CR.stats : {};
const S = (X.stats && !X.stats.error) ? X.stats : null;
if (hasIX && IX.centerline_routed && IX.centerline_routed.length>2) COR.centerline = IX.centerline_routed;
const SEV_COLOR_VAR={O:'--sevO',C:'--sevC',B:'--sevB',A:'--sevA',K:'--sevK'};
const ADV_WEATHER = ['Rain','Snow','Fog/Smog/Smoke','Sleet/Hail','Freezing Rain'];
const isAdvPoint = p => p.surface!=='Dry' || ADV_WEATHER.includes(p.weather);

/* theme ---------------------------------------------------------- */
(function(){

const RENDERERS = [];

function chartCard(parent, {title, sub, full=false, render, table, legend}){
  const card = h('div', {class:'card'+(full?' full':'')});
  const tog = h('div',{class:'toggle'});
  const bChart = h('button',{type:'button','aria-pressed':'true'},'Chart');
  const bTable = h('button',{type:'button','aria-pressed':'false'},'Table');
  tog.append(bChart,bTable);
  const head = h('div',{class:'card-head'}, h('div',{}, h('h3',{},title), sub? h('div',{class:'sub'},sub):null), table? tog : null);
  const chartWrap = h('div',{class:'chartview'});
  const legendEl = legend ? h('div',{class:'legend'}) : null;
  const body = h('div',{class:'chart'});
  if (legendEl) chartWrap.append(legendEl); chartWrap.append(body);
  const tableWrap = h('div',{class:'tableview'});
  if (table) tableWrap.append(buildTable(table));
  card.append(head, chartWrap, tableWrap);
  parent.append(card);
  const doRender = ()=>{ body.innerHTML=''; if (legendEl){ legendEl.innerHTML=''; legend.forEach(l=>legendEl.append(h('span',{}, h('i',{style:'background:'+(l.var?css(l.var):l.color)}), l.name))); } render(body); };
  RENDERERS.push(doRender);
  bChart.onclick=()=>{ bChart.setAttribute('aria-pressed','true'); bTable.setAttribute('aria-pressed','false'); chartWrap.classList.remove('hide'); tableWrap.classList.remove('show'); doRender(); };
  bTable.onclick=()=>{ bChart.setAttribute('aria-pressed','false'); bTable.setAttribute('aria-pressed','true'); chartWrap.classList.add('hide'); tableWrap.classList.add('show'); };
  requestAnimationFrame(doRender);

}
function buildTable({columns, rows, numeric}){
  const wrap = h('div',{class:'tbl-scroll'});
  const t = h('table',{class:'t'});
  t.append(h('thead',{}, h('tr',{}, columns.map((c,i)=>h('th',{class:(numeric&&numeric[i])?'num':''},c)))));
  t.append(h('tbody',{}, rows.map(r=>h('tr',{}, r.map((v,i)=>h('td',{class:(numeric&&numeric[i])?'num':''}, (v===null||v===undefined)?'–':(v.nodeType?v:String(v))))))));
  wrap.append(t); return wrap;
}
function tooltip(container){
  let tip = container.querySelector('.tip'); if(!tip){ tip=h('div',{class:'tip'}); container.append(tip); }
  return {
    show(html, x, y){ tip.innerHTML=html; tip.style.display='block'; const W=container.clientWidth; const tw=tip.offsetWidth; let lx = x+12; if (lx+tw > W) lx = x-12-tw; tip.style.left=Math.max(0,lx)+'px'; tip.style.top=Math.max(0,y-10)+'px'; },
    hide(){ tip.style.display='none'; }
  };
}
function niceTicks(min, max, n=5){
  if (max===min) max=min+1;
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))), r=step0/mag;
  const step = (r<1.5?1: r<3?2: r<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const out=[]; for(let v=lo; v<=hi+1e-9; v+=step) out.push(+v.toFixed(10)); return out;
}

/* line chart ------------------------------------------------------ */
function lineChart(el, {x, series, height=240, yMin=null, yMax=null, yFmt=v=>fmt(v), xLabel=(i)=>x[i], xTicks=null, refLines=[], area=false, pad={l:44,r:12,t:10,b:28}}){
  const W = Math.max(320, el.clientWidth), H = height;
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const all = series.flatMap(sr=>sr.values.filter(v=>v!==null&&v!==undefined));
  let lo = yMin===null? Math.min(...all) : yMin, hi = yMax===null? Math.max(...all) : yMax;
  if (yMin===null && lo>0 && area) lo=0;
  const ticks = niceTicks(lo, hi, 5); lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const n = x.length, xs = i => pad.l + (n>1? i/(n-1):0.5)*iw, ys = v => pad.t + ih - (v-lo)/(hi-lo)*ih;
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`, width:W, height:H});
  for (const t of ticks){ svg.append(s('line',{x1:pad.l,x2:W-pad.r,y1:ys(t),y2:ys(t),stroke:css('--grid'),'stroke-width':1})); svg.append(s('text',{x:pad.l-6,y:ys(t)+4,'text-anchor':'end','font-size':11,fill:css('--muted')}, yFmt(t))); }
  const xt = xTicks || Array.from({length:Math.min(n, 8)},(_,k)=>Math.round(k*(n-1)/Math.max(1,Math.min(n,8)-1)));
  for (const i of xt){ svg.append(s('text',{x:xs(i),y:H-8,'text-anchor':'middle','font-size':11,fill:css('--muted')}, xLabel(i))); }
  svg.append(s('line',{x1:pad.l,x2:W-pad.r,y1:pad.t+ih,y2:pad.t+ih,stroke:css('--axis')}));
  for (const r of refLines){ svg.append(s('line',{x1:pad.l,x2:W-pad.r,y1:ys(r.y),y2:ys(r.y),stroke:css('--muted'),'stroke-dasharray':'4 3'})); svg.append(s('text',{x:W-pad.r,y:ys(r.y)-4,'text-anchor':'end','font-size':11,fill:css('--ink-2')}, r.label)); }
  for (const sr of series){
    const color = sr.var? css(sr.var) : sr.color;
    let d='', started=false;
    sr.values.forEach((v,i)=>{ if(v===null||v===undefined){started=false;return;} d += (started?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1); started=true; });
    if (area){ const first=sr.values.findIndex(v=>v!=null), last=sr.values.length-1-[...sr.values].reverse().findIndex(v=>v!=null); svg.append(s('path',{d:d+`L${xs(last)} ${ys(lo)}L${xs(first)} ${ys(lo)}Z`,fill:color,'fill-opacity':.12,stroke:'none'})); }
    svg.append(s('path',{d,fill:'none',stroke:color,'stroke-width':sr.width||1.8,'stroke-linejoin':'round'}));
  }
  const cross = s('line',{x1:0,x2:0,y1:pad.t,y2:pad.t+ih,stroke:css('--ink-2'),'stroke-width':1,visibility:'hidden'}); svg.append(cross);
  const dots = series.map(sr=>{ const c=s('circle',{r:4,fill:sr.var?css(sr.var):sr.color,stroke:css('--surface'),'stroke-width':2,visibility:'hidden'}); svg.append(c); return c; });
  const tip = tooltip(el);
  const hit = s('rect',{x:pad.l,y:pad.t,width:iw,height:ih,fill:'transparent'}); svg.append(hit);
  hit.addEventListener('mousemove', ev => { const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*(W/r.width); const i=Math.max(0,Math.min(n-1,Math.round((px-pad.l)/iw*(n-1)))); cross.setAttribute('x1',xs(i)); cross.setAttribute('x2',xs(i)); cross.setAttribute('visibility','visible');
    let html='<b>'+xLabel(i,true)+'</b>'; series.forEach((sr,k)=>{ const v=sr.values[i]; if(v==null){dots[k].setAttribute('visibility','hidden');} else { dots[k].setAttribute('cx',xs(i)); dots[k].setAttribute('cy',ys(v)); dots[k].setAttribute('visibility','visible'); } html+='<br>'+sr.name+': <b>'+(v==null?'–':yFmt(v))+'</b>'; });
    tip.show(html, xs(i)*(r.width/W), (ev.clientY-r.top)); });
  hit.addEventListener('mouseleave', ()=>{ cross.setAttribute('visibility','hidden'); dots.forEach(d=>d.setAttribute('visibility','hidden')); tip.hide(); });
  el.append(svg);

/* bar chart (grouped or stacked) ------------------------------------ */
function barChart(el, {categories, series, stacked=false, height=240, yFmt=v=>fmt(v), pad={l:44,r:12,t:10,b:28}, labelEvery=1, yMax=null}){
  const W = Math.max(320, el.clientWidth), H=height, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, n=categories.length;
  let hi = yMax!==null? yMax : (stacked ? Math.max(...categories.map((_,i)=>series.reduce((a,sr)=>a+(sr.values[i]||0),0))) : Math.max(...series.flatMap(sr=>sr.values.map(v=>v||0))));
  if (!(hi>0)) hi=1;
  const ticks=niceTicks(0,hi,5); hi=ticks[ticks.length-1];
  const ys=v=>pad.t+ih-(v/hi)*ih, bw=iw/n, gap=Math.min(6,bw*.25);
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(const t of ticks){ svg.append(s('line',{x1:pad.l,x2:W-pad.r,y1:ys(t),y2:ys(t),stroke:css('--grid')})); svg.append(s('text',{x:pad.l-6,y:ys(t)+4,'text-anchor':'end','font-size':11,fill:css('--muted')},yFmt(t))); }
  svg.append(s('line',{x1:pad.l,x2:W-pad.r,y1:pad.t+ih,y2:pad.t+ih,stroke:css('--axis')}));
  const tip=tooltip(el);
  categories.forEach((c,i)=>{
    const x0=pad.l+i*bw+gap/2, bwi=bw-gap;
    if (i%labelEvery===0) svg.append(s('text',{x:x0+bwi/2,y:H-8,'text-anchor':'middle','font-size':11,fill:css('--muted')},c));
    const g=s('g'); let acc=0;
    const k=series.length, sw = stacked? bwi : (bwi-2*(k-1))/k;
    series.forEach((sr,j)=>{
      const v=sr.values[i]||0; const color=sr.var?css(sr.var):sr.color;
      let x=x0, y, hgt;
      if (stacked){ y=ys(acc+v); hgt=ys(acc)-ys(acc+v); acc+=v; if(hgt>2){ y+=1; hgt-=2; } }
      else { x=x0+j*(sw+2); y=ys(v); hgt=ys(0)-ys(v); }
      if (v>0) g.append(s('rect',{x,y,width:stacked?bwi:sw,height:Math.max(0,hgt),fill:color,rx:2}));
    });
    const hit=s('rect',{x:x0-gap/2,y:pad.t,width:bw,height:ih,fill:'transparent'});
    hit.addEventListener('mousemove',ev=>{ const r=svg.getBoundingClientRect(); let html='<b>'+c+'</b>'; let tot=0; series.forEach(sr=>{ const v=sr.values[i]; tot+=v||0; html+='<br>'+sr.name+': <b>'+(v==null?'–':yFmt(v))+'</b>'; }); if(stacked&&series.length>1) html+='<br>Total: <b>'+yFmt(tot)+'</b>'; tip.show(html,(x0+bw/2)*(r.width/W),ev.clientY-r.top); });
    hit.addEventListener('mouseleave',()=>tip.hide());
    svg.append(g,hit);
  });
  el.append(svg);
}

/* calendar strip: one row per year, one column per day --------------- */
function calendarStrip(el, daily){
  const years=[...new Set(daily.date.map(d=>d.slice(0,4)))];
  const W=Math.max(320, el.clientWidth), left=40, top=18, rowH=18, cellW=(W-left-8)/366;
  const H=top+years.length*rowH+22;

  const doy = ds => { const d=new Date(ds+'T00:00:00Z'); const j=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.round((d-j)/864e5); };
  MONTHS.forEach((m,k)=>{ const dd=doy(`2024-${String(k+1).padStart(2,'0')}-01`); svg.append(s('text',{x:left+dd*cellW,y:12,'font-size':11,fill:css('--muted')},m)); });
  years.forEach((y,r)=>svg.append(s('text',{x:left-6,y:top+r*rowH+13,'text-anchor':'end','font-size':11,fill:css('--ink-2')},y)));
  const tip=tooltip(el);
  const g=s('g');
  years.forEach((y,r)=>g.append(s('rect',{x:left,y:top+r*rowH+1,width:366*cellW,height:rowH-3,fill:clsColor(0),opacity:.6})));
  daily.date.forEach((ds,i)=>{ const r=years.indexOf(ds.slice(0,4)); const c=daily.cls[i]; if(c===0) return; g.append(s('rect',{x:left+doy(ds)*cellW,y:top+r*rowH+1,width:Math.max(1,cellW),height:rowH-3,fill:clsColor(c)})); });
  svg.append(g);
  const hit=s('rect',{x:left,y:top,width:366*cellW,height:years.length*rowH,fill:'transparent'});
  hit.addEventListener('mousemove',ev=>{ const rb=svg.getBoundingClientRect(); const px=(ev.clientX-rb.left)*(W/rb.width), py=(ev.clientY-rb.top)*(H/rb.height); const r=Math.floor((py-top)/rowH), d=Math.floor((px-left)/cellW); if(r<0||r>=years.length) return; const y=years[r]; const dt=new Date(Date.UTC(+y,0,1+d)); const ds=dt.toISOString().slice(0,10); const i=daily.date.indexOf(ds); if(i<0){tip.hide();return;}
    tip.show(`<b>${ds}</b> · ${CLS_SHORT[daily.cls[i]]}<br>Rain (area mean / max): ${fmt(daily.prcp_mean[i],2)} / ${fmt(daily.prcp_max[i],2)} in<br>Snow (max station): ${fmt(daily.snow_max[i],1)} in · depth ${fmt(daily.snwd_max[i],1)} in<br>Tmin / Tmax: ${fmt(daily.tmin[i])} / ${fmt(daily.tmax[i])} °F`, px*(rb.width/W), ev.clientY-rb.top); });

/* dot-and-whisker chart (rate ratios with CI, medians with ranges) --- */
function ciChart(el, {rows, series, xFmt=v=>fmt(v,2), refLine=null, log=false, rowH=null, labelW=170, xMin=null, xMax=null, pad={r:14,t:8,b:26}}){

  let lo=xMin!==null?xMin:Math.min(...vals), hi=xMax!==null?xMax:Math.max(...vals);

    series.forEach((sr,j)=>{ const v=r.vals[j]; if(!v||v.v==null) return; const y=y0+(j+0.5)*(rowH/k); const color=sr.var?css(sr.var):sr.color;
      if (v.lo!=null&&v.hi!=null&&(!log||(v.lo>0))) svg.append(s('line',{x1:xs(Math.max(v.lo,lo)),x2:xs(Math.min(v.hi,hi)),y1:y,y2:y,stroke:color,'stroke-width':2,'stroke-linecap':'round'}));
      svg.append(s('circle',{cx:xs(Math.min(Math.max(v.v,lo),hi)),cy:y,r:4.5,fill:color,stroke:css('--surface'),'stroke-width':1.5})); });
    const hit=s('rect',{x:0,y:y0,width:W,height:rowH,fill:'transparent'});
    hit.addEventListener('mousemove',ev=>{ const rb=svg.getBoundingClientRect(); let html='<b>'+r.label+'</b>'; series.forEach((sr,j)=>{ const v=r.vals[j]; if(!v) return; html+='<br>'+sr.name+': <b>'+xFmt(v.v)+'</b>'+(v.lo!=null?' ['+xFmt(v.lo)+' to '+xFmt(v.hi)+']':'')+(v.note?' · '+v.note:''); }); tip.show(html,(ev.clientX-rb.left),ev.clientY-rb.top); });
    hit.addEventListener('mouseleave',()=>tip.hide()); svg.append(hit); });

/* diverging correlation matrix ------------------------------------- */

function divColor(r){ const neutral=css('--surface-2'), pos=css('--s1'), neg=css('--s2'); if(r==null) return neutral; const t=Math.min(1,Math.abs(r)); const steps=5; const q=Math.ceil(t*steps)/steps; return hexLerp(neutral, r>=0?pos:neg, Math.max(0.12,q)); }
function corrMatrix(el, {labels, values, pvals, shortLabels}){

function stripChart(el, {pts, metric, metricLabel}){
  const W=Math.max(320, el.clientWidth), padL=46, padR=12, topH=170, bandH=16, H=topH+2*bandH+70;
  const mpMax=COR_MP_MAX, iw=W-padL-padR, xs=mp=>padL+(mp/mpMax)*iw;
  const bins={}; pts.forEach(p=>{ if(p.mp==null||p.dir==='X') return; const b=Math.floor(p.mp*2)/2; bins[b]=bins[b]||{E:0,W:0}; bins[b][p.dir]++; });
  const mx=Math.max(1,...Object.values(bins).flatMap(b=>[b.E,b.W]));
  const mid=topH/2+8, ys=v=>(v/mx)*(topH/2-14);
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H}); const tip=tooltip(el);
  const ticks=niceTicks(0,mx,3).filter(t=>t<=mx);
  ticks.forEach(t=>{ [mid-ys(t), mid+ys(t)].forEach((y,q)=>{ if(t===0&&q===1) return; svg.append(s('line',{x1:padL,x2:W-padR,y1:y,y2:y,stroke:css('--grid')})); svg.append(s('text',{x:padL-6,y:y+4,'text-anchor':'end','font-size':10,fill:css('--muted')},fmt(t))); }); });
  svg.append(s('text',{x:padL+4,y:18,'font-size':10,fill:css('--ink-2'),'font-weight':600},'EB crashes ▲')); svg.append(s('text',{x:padL+4,y:topH+6,'font-size':10,fill:css('--ink-2'),'font-weight':600},'WB crashes ▼'));
  Object.entries(bins).forEach(([b,v])=>{ const x=xs(+b)+1, w=Math.max(1,xs(+b+0.5)-xs(+b)-2);
    if(v.E) svg.append(s('rect',{x,y:mid-ys(v.E),width:w,height:ys(v.E),fill:css('--s1'),rx:2})); if(v.W) svg.append(s('rect',{x,y:mid+1,width:w,height:ys(v.W),fill:css('--s2'),rx:2}));
    const hit=s('rect',{x,y:8,width:w,height:topH,fill:'transparent'}); hit.addEventListener('mousemove',ev=>{ const rb=svg.getBoundingClientRect(); tip.show(`<b>MP ${b} to ${(+b+0.5).toFixed(1)}</b><br>EB: <b>${v.E}</b> · WB: <b>${v.W}</b> crashes`,(x+w/2)*(rb.width/W),ev.clientY-rb.top); }); hit.addEventListener('mouseleave',()=>tip.hide()); svg.append(hit); });
  svg.append(s('line',{x1:padL,x2:W-padR,y1:mid,y2:mid,stroke:css('--axis')}));
  // INRIX bands
  if (hasIX){ const vals=IX.tmcs.map(t=>segMetric(t,metric)); const lo=Math.min(...vals), hi=Math.max(...vals);
    ['E','W'].forEach((d,row)=>{ const y=topH+14+row*(bandH+4); let acc=0; svg.append(s('text',{x:padL-6,y:y+bandH-4,'text-anchor':'end','font-size':10,fill:css('--ink-2')},d+'B'));
      const segs=IX.tmcs.filter(t=>t.dir===d).sort((a,b)=>a.order-b.order); const total=segs.reduce((a,t)=>a+t.miles,0); const scale=mpMax/total;
      segs.forEach(t=>{ let m0=acc*scale, m1=(acc+t.miles)*scale; acc+=t.miles; if(d==='W'){ const a=mpMax-m1, b=mpMax-m0; m0=a; m1=b; }
        const v=segMetric(t,metric); const rect=s('rect',{x:xs(m0)+0.5,y,width:Math.max(1,xs(m1)-xs(m0)-1),height:bandH,fill:rampColor(v,lo,hi,metric==='speed_mean')});
        rect.addEventListener('mousemove',ev=>{ const rb=svg.getBoundingClientRect(); tip.show(`<b>${d}B ${t.name}</b><br>${metricLabel}: <b>${segFmt(metric,v)}</b><br>Mean ${t.speed_mean} mph · below 50 mph ${pct(t.p_lt50,1)} · episodes as worst segment ${fmt((IX.worst_tmc_counts||{})[t.tmc]||0)}`,(ev.clientX-rb.left),ev.clientY-rb.top); }); rect.addEventListener('mouseleave',()=>tip.hide()); svg.append(rect); }); }); }
  // interchanges + zones
  const yAx=topH+14+2*(bandH+4)+6;
  svg.append(s('line',{x1:padL,x2:W-padR,y1:yAx,y2:yAx,stroke:css('--axis')}));
  COR.interchanges.forEach((x,i)=>{ const px=xs(x.mp); svg.append(s('line',{x1:px,x2:px,y1:yAx,y2:yAx+5,stroke:css('--axis')})); const lab=x.mp===0?'PA line':x.label.startsWith('Exit')?x.label.split(' - ')[0]:x.label.split(' ')[0]; svg.append(s('text',{x:px,y:yAx+16,'text-anchor':i===0?'start':i===COR.interchanges.length-1?'end':'middle','font-size':9.5,fill:css('--muted')},lab+' · MP '+x.mp)); });
  COR.zones.forEach((z,i)=>{ const x0=xs(z.mp_start), x1=xs(z.mp_end); svg.append(s('rect',{x:x0,y:yAx+22,width:Math.max(1,x1-x0-1),height:8,fill:css(ZONE_VARS[i%ZONE_VARS.length]),opacity:.75,rx:2})); if(x1-x0>22) svg.append(s('text',{x:(x0+x1)/2,y:yAx+40,'text-anchor':'middle','font-size':9,fill:css('--muted')},z.id)); });
  el.append(svg);

const ZONE_VARS=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const SEQ=['--seq1','--seq2','--seq3','--seq4','--seq5'];
function rampColor(v,lo,hi,reverse){ if(v==null) return css('--grid'); let t=hi>lo?(v-lo)/(hi-lo):0; if(reverse) t=1-t; return css(SEQ[Math.min(4,Math.floor(t*4.999))]); }
function segMetric(t,m){ return m==='episodes' ? ((IX.worst_tmc_counts||{})[t.tmc]||0) : t[m]; }
function segFmt(m,v){ return m==='speed_mean'? fmt(v,1)+' mph' : m==='episodes'? fmt(v)+' episodes' : pct(v,1); }
// milepost → position along the configured centerline (haversine-scaled)
const COR_MP_MAX = Math.max(...COR.interchanges.map(x=>x.mp));
const COR_CUM = (()=>{ const pts=COR.centerline; const d=[0]; const R=3958.8, rad=x=>x*Math.PI/180; for(let i=1;i<pts.length;i++){ const [a,b]=pts[i-1],[c,e]=pts[i]; const dl=rad(c-a), dn=rad(e-b); const h2=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2; d.push(d[i-1]+2*R*Math.asin(Math.sqrt(h2))); } const tot=d[d.length-1]||1; return d.map(x=>x/tot*COR_MP_MAX); })();
function mpToLatLng(mp){ const pts=COR.centerline; mp=Math.max(0,Math.min(COR_MP_MAX,mp)); for(let i=1;i<pts.length;i++){ if(mp<=COR_CUM[i]){ const t=(mp-COR_CUM[i-1])/((COR_CUM[i]-COR_CUM[i-1])||1); return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t]; } } return pts[pts.length-1]; }
function mpPath(m0,m1,step=0.1){ const out=[mpToLatLng(m0)]; for(let m=Math.ceil(m0/step)*step; m<m1; m+=step) out.push(mpToLatLng(m)); out.push(mpToLatLng(m1)); return out; }

 {id:'S0', name:'Normal operations (baseline)', trigger:'No adverse weather, no incident, no work zone, no sensor fault.', speed:'65 mph posted on every VSL sign (the static regulatory limit).',

  behavior:['Algorithm runs every 30 s on the latest RWIS (10-min) and traffic (1-min) data; computes a candidate speed for each zone; candidate equals 65 so nothing changes.','Automated health check every cycle: sign read-back, sensor heartbeat, data age. A stale input (> 20 min RWIS, > 5 min traffic) raises a device alarm, not a speed change.','Posted limit, candidate speed and every input are logged each cycle (CDOT 7.1) so a citation can be defended later.'],

 {id:'S1', name:'Rain and wet pavement (friction-based)', trigger:'RWIS surface status WET, or grip ≤ 0.60, or precipitation intensity ≥ 0.10 in/h, confirmed on two consecutive 10-min RWIS cycles or at two RWIS sites in adjacent zones.', speed:'55 mph (grip 0.50 to 0.60) stepping to 50 mph (grip 0.40 to 0.50) or 45 mph (grip < 0.40, heavy rain with spray). Jugtown downgrade zones go one step lower because grade is subtracted from friction (CDOT Eq. 2).',
  detect:'RWIS pavement sensors at the ridge, the Musconetcong valley and the Delaware approach; NWS radar precipitation rate as a secondary check; CCTV for operator confirmation.', exposure:(hasC?`${fmt(py.wet+py.heavy,0)} wet days/yr (${fmt(py.heavy,0)} with ≥ 1 in)`:'')+(hasCR?`; ${fmt(ST.wet_n)} crashes on wet pavement (${pct(ST.wet_n/ST.n)} of all), ${fmt((CR.by_surface.find(r=>r.k==='Wet')||{}).injury)} with injury`:'')+(hasIX&&X.speed_by_cls?`; drivers hold ${fmt((X.speed_by_cls.find(r=>r.dir==='E'&&r.cls===1)||{}).speed,1)} mph on wet days`:''),
  behavior:['Detection: RWIS reports WET and grip 0.52 at the Jugtown site; INRIX speeds still 66 mph (drivers not compensating, as the wet-day speed data shows).','Compute: braking distance to hold = 65² ÷ (30 × 0.82) = 172 ft; speed that stops in 172 ft at grip 0.52 minus 4.5% grade = √(30 × 172 × 0.475) ≈ 49.5 → 50 mph in the grade zone, 55 in level zones.','Transition: zones upstream post 60 then 65 so no driver meets a drop larger than 10 mph (CDOT 4.1.1).','Post: VSL signs change, amber beacons flash for the first 5 min, DMS reads "WET ROAD / REDUCED SPEED LIMIT AHEAD"; 511NJ event auto-created.','Verify: sign controller echoes the displayed value; CCTV snapshot stored with the log entry.','Hold and relax: a lowered limit stays at least 6 min; limits rise one 5-mph step per 6-min cycle and only after grip ≥ 0.65 for 30 min (hysteresis prevents flicker).'],
  users:{m:'Sees beacons and the new limit; advance DMS tells them why. Trucks on the descent see the same limit (NJ has no differential truck limit).', t:'In "auto with notify" mode, operator gets an alert with the sensor values and CCTV frame; can veto within one cycle or override to a lower value. Logs any manual action with a reason code.', i:'No action unless an RWIS flags a data-quality fault; grip sensors need periodic calibration against the dry baseline.', e:'NJSP receives the active-limit feed; enforcement of the posted limit uses the archive time stamp.', p:'511NJ and the NJDOT social feed show "I-78 MP 0-13: speed limit reduced to 50 mph, wet road".'},
  njnotes:'Ida (2 Sep 2021, 7.3 in) and the ten heaviest rain days are the stress cases: very heavy rain also cuts visibility, so S1 hands off to the S3 visibility check in the same algorithm pass. Heavy-rain days show 1.4 times the dry-day crash rate and the longest wet-weather slowdowns in the INRIX record.'},
 {id:'S2', name:'Snow, ice and freezing precipitation', trigger:'RWIS surface status SNOW, ICE, FROST or SLUSH; or grip ≤ 0.45; or pavement temperature ≤ 32 °F with any precipitation; or NJDOT winter-operations "salting in progress" flag. Pre-stage on an NWS Winter Weather Advisory or Warning for Warren / Hunterdon.', speed:'45 mph on snow-covered lanes (grip 0.35 to 0.45), 40 mph in active snowfall with reduced visibility, 35 mph minimum in icing or when plows run in echelon. Raises in 5-mph steps as plows clear and grip recovers.',
  detect:'RWIS pavement temperature and grip; precipitation-type sensor at the ridge; plow AVL from NJDOT winter operations; CCTV.', exposure:(hasC?`${fmt(py.snow_lt+py.snow_sig+py.snow_maj,0)} snow days/yr, ${fmt(py.freezing,0)} freezing-precip days/yr, ${fmt(C.period.per_year_freeze_thaw,0)} freeze-thaw days/yr`:'')+(hasCR?`; ${fmt(ST.snow_ice_n)} crashes on snow / ice / slush; snow-day crash rate 1.3 to 1.6 times dry`:'')+(hasIX&&X.speed_by_cls?`; speeds stay at ${fmt((X.speed_by_cls.find(r=>r.dir==='E'&&r.cls===5)||{}).speed,1)} mph on 1-3 in snow days`:''),
  behavior:['Pre-stage (advisory issued): operator arms the winter profile; DMS announces "WINTER STORM EXPECTED, SPEED LIMIT MAY BE LOWERED"; no speed change yet.','Onset: pavement temperature drops through 32 °F with precipitation; with grip 0.35 and 4.5% grade the algorithm returns √(30 × 172 × 0.305) ≈ 39.7 → 40 mph on the grades, 45 elsewhere.','Active storm: if visibility < 1,000 ft the visibility loop lowers to 35 mph (floor). Signs show 35 across all zones; no transition steps needed because every zone is at the floor.','Plow operations: when plow AVL shows a plow train in a zone, that zone and the one upstream post the lesser of the algorithm value and 35 mph.','Post-storm refreeze: pavement temperature < 30 °F with residual moisture at night keeps 50 mph on bridges and the ridge until the sensors warm; the freeze-thaw days in the climate record are the exposure for this sub-case.','Recovery: limits step up 5 mph per 6-min cycle, only after grip has held above threshold for 30 min; operator can hold a lower value while crews are still on the shoulder.'],
  users:{m:'Sees staged DMS warnings before the storm, then VSL values that track the road surface; limits rise again as the road clears, which builds trust.', t:'Arms the winter profile; confirms plow AVL integration; may hold limits for crew safety; coordinates with the regional maintenance yard on the salt / plow timeline.', i:'Winter readiness checks on RWIS heaters and sign faces; snow removal around cabinets.', e:'NJSP Perryville Station (Exit 12) uses the posted limit for enforcement and requests holds when working crashes; Hunterdon / Warren EMS get the active-limit feed.', p:'511NJ pushes the limit and road-surface status; media briefings cite the VSL as part of the storm plan.'},
  njnotes:'The two COOP temperature stations are in valleys (71 m and 81 m); the Jugtown ridge is 150 to 200 m higher and will freeze earlier. The summit RWIS is the critical sensor. The 18 Feb 2021 snow day produced 6 crashes on the section.'},
 {id:'S3', name:'Fog and low visibility', trigger:'RWIS visibility sensor < 1,000 ft (iterative lowering per CDOT Eq. 4/5), confirmed by CCTV contrast check or a second sensor; NWS Dense Fog Advisory as pre-stage. Also smoke or heavy-rain spray.', speed:'55 mph at 800 ft, 50 at 650 ft, 45 at 500 ft, 40 at 400 ft, 35 mph (floor) below about 300 ft, using 2.5 s perception-reaction plus braking on the measured friction.',
  detect:'Forward-scatter visibility sensors co-located with the RWIS at the Delaware approach, Bloomsbury valley and the ridge; CCTV image-contrast analytics as a check.', exposure:(hasCR?`${fmt(ST.fog_n)} fog-coded crashes in ${ST.nyears} yr. `:'')+'Fog hours are not measurable from GHCN-Daily (data gap); expect late-summer and autumn radiation-fog mornings in the Musconetcong and Delaware valleys. Quantify from hourly ASOS at Lehigh Valley Intl (KABE) or the RWIS once installed.',
  behavior:['Detection: visibility 600 ft at the Bloomsbury site at 06:10 on a September weekday; dry pavement; speeds 67 mph.','Compute: at 65 mph the minimum acceptable visibility is 2.5 × 1.47 × 65 + 65² ÷ (30 × 0.82) ≈ 411 ft; 600 ft ≥ 411 ft so no change on the equation alone. The sensor reading < 1,000 ft triggers the policy table instead: 600 ft → 50 mph. The ConOps should state which rule governs.','Post: 50 mph in the fog zone with 60 and 65 transitions upstream; DMS "FOG AHEAD / SPEED LIMIT 50"; beacons on.','Spatial limit: only zones whose sensor (or neighbour sensor within 2 mi) reports low visibility change; patchy valley fog must not drop the whole corridor.','Clear: limits restore 5 mph per cycle after visibility > 1,500 ft for 15 min.'],
  users:{m:'Sees beacons and limit before entering the fog bank; the limit is the cue, because the fog is often not visible from the ridge.', t:'Verifies on CCTV (fog is the scenario most prone to sensor false positives from lens condensation); can override the zone to normal with a reason code.', i:'Keeps sensor optics clean; checks heater function.', e:'NJSP gets the alert; fog-related multi-vehicle crashes are the headline risk this scenario addresses.', p:'511NJ fog alert.'},
  njnotes:'Visibility is the one trigger with no exposure data in the repo. Pull hourly ASOS visibility for KABE (and KSMQ Somerset as an east reference) for 2021-25 to count fog hours by month and hour before finalising this scenario\'s activation estimate.'},
 {id:'S4', name:'Dense-flow speed harmonization (contingent, flow-based)', trigger:'6-minute running average flow ≥ inflection flow while mean speed is still ≥ 60 mph. INRIX shows no recurring congestion anywhere in the study section, so this component is contingent on volume data showing peak flows above 1,000 vphpl (CDOT Figure 2); otherwise it is out of scope.', speed:'60 → 55 → 50 mph as flow rises, computed as maximum flow momentum ÷ observed flow, rounded to 5 mph, floored at the dry minimum (45 mph).',

  behavior:['Detection: flow averages 1,350 vphpl with speeds 64 mph (dense, fast, short headways; the steep part of the crash-rate hockey-stick curve).','Compute: momentum 1,100 vphpl × 68 mph = 74,800; 74,800 ÷ 1,350 = 55.4 → 55 mph.','Post: 55 mph across the dense zones, 65 upstream of the first affected zone. Minimum 6-min dwell before any further change.','Harmonization outcome: speed variance drops; the aim is fewer rear-end and sideswipe crashes and delayed flow breakdown, not a lower average speed.','Relax: when the 6-min flow average falls below the threshold for two cycles, raise one step per cycle back to 65.'],

 {id:'S5', name:'Traffic incident and queue protection', trigger:'(a) Automatic: zone mean speed falls ≥ 20 mph below the 6-min reference for two 30-s cycles, or any segment < 35 mph; (b) Operator: incident entered in the TOC event system (OpenReach / ATMS) or NJSP CAD with lane blockage; (c) Field request from NJSP, EMS or the Safety Service Patrol at the scene.', speed:'Zone with the queue: observed mean speed + 5, rounded up (CDOT 4.2.1), floored at 35 mph; zone upstream +10 mph; further upstream +10 again. Scene-protection manual value typically 45 mph (35 in adverse weather).',
  detect:'MVRD / INRIX speed drop; CCTV; CAD feed; Safety Service Patrol radio; Waze / connected-vehicle crowd reports as early hints.', exposure:(hasIX?`${es_.E?fmt(es_.E.n_per_year,0):'–'} EB and ${es_.W?fmt(es_.W.n_per_year,0):'–'} WB slowdown episodes per year (median ${es_.E?fmt(es_.E.median_dur_min):'–'} / ${es_.W?fmt(es_.W.median_dur_min):'–'} min), most in the afternoon and evening`:'')+(hasCR?`; ${fmt(ST.secondary_n)} plausible secondary crashes (${pct(ST.secondary_share,1)}); the 12 Sep 2025 day had ${fmt(CR.top_days[0].n)} crashes`:''),

/* ---- CDOT algorithm calculator ---------------------------------------- */
function round5(v){ return Math.round(v/5)*5; }
function ceil5(v){ return Math.ceil(v/5)*5; }
function vslCompute(p){
  const out={steps:[]};
  const Smax=p.smax, minDry=p.minDry, minAdv=p.minAdv;
  let Sflow=Smax;
  if (p.flow>0 && p.inflect>0){ const M=p.inflect*p.ffs; Sflow=Math.min(Smax, Math.max(minDry, round5(M/p.flow))); out.steps.push(`Flow-based: momentum ${fmt(p.inflect)} vphpl × ${p.ffs} mph = ${fmt(M)}; ÷ ${fmt(p.flow)} vphpl = ${fmt(M/p.flow,1)} → ${Sflow} mph (capped ${minDry}–${Smax})`); }
  else out.steps.push('Flow-based: no flow input, stays at '+Smax);
  let Squeue=Smax;
  if (p.dsSpeed>0 && p.dsSpeed<Smax){ Squeue=Math.min(Smax, Math.max(minAdv, ceil5(p.dsSpeed+5))); out.steps.push(`Queue-based: downstream mean ${p.dsSpeed} mph + 5 → rounded up to ${Squeue} mph`); }
  else out.steps.push('Queue-based: downstream traffic free-flowing, stays at '+Smax);
  let Strans=Math.min(Smax, p.dsPosted+10); out.steps.push(`Transition: downstream posted ${p.dsPosted} + 10 → ${Strans} mph`);
  const Sdry=Math.max(minDry, Math.min(Sflow,Squeue,Strans));
  out.steps.push(`Dry speed = max(${minDry}, min(${Sflow}, ${Squeue}, ${Strans})) = ${Sdry} mph`);
  const cfDry=0.82-p.grade;
  const Db=Sdry*Sdry/(30*cfDry);
  const Cfg=Math.max(0.03, p.friction-p.grade);
  let Sfg=Math.min(Sdry, round5(Math.sqrt(30*Db*Cfg)));
  Sfg=Math.max(minAdv,Sfg);
  out.steps.push(`Braking distance to hold: ${Sdry}² ÷ (30 × ${cfDry.toFixed(2)}) = ${fmt(Db)} ft; friction-and-grade coefficient ${p.friction.toFixed(2)} − ${p.grade.toFixed(3)} = ${Cfg.toFixed(2)}; √(30 × ${fmt(Db)} × ${Cfg.toFixed(2)}) = ${fmt(Math.sqrt(30*Db*Cfg),1)} → ${Sfg} mph`);
  let S=Sfg; const vmin=v=>2.5*1.47*v + v*v/(30*Cfg);
  let iter=0;
  while (p.vis>0 && p.vis<vmin(S) && S>minAdv && iter<20){ S-=5; iter++; }
  if (p.vis>0) out.steps.push(`Visibility: need ${fmt(vmin(Sfg))} ft at ${Sfg} mph; observed ${fmt(p.vis)} ft → ${iter?`lowered ${iter} step(s) to ${S} mph (needs ${fmt(vmin(S))} ft)`:'no change'}`);
  S=Math.max(minAdv,S);
  out.final=S; out.Sdry=Sdry; out.Sflow=Sflow; out.Squeue=Squeue; out.Strans=Strans; out.Sfg=Sfg; out.Db=Db;
  return out;
}

    [['Flow-based speed',r.Sflow],['Queue-based speed',r.Squeue],['Transition speed',r.Strans],['Dry speed (min of the three, floored)',r.Sdry],['Friction-and-grade speed',r.Sfg],['Final posted speed',r.final+' mph']].forEach(([k,v])=>outKV.append(h('span',{},k),h('b',{},typeof v==='number'?v+' mph':v)));

  }
  update();
  return card;
}

    out2.append(tile(fmt(delayInc)+' veh-h','Delay per slowdown episode',`${v.exMin} excess veh-min per veh/h × ${fmt(v.vph)} veh/h ÷ 60`), tile(fmt(vehHrsSaved)+' veh-h / yr','Incident delay avoided',`${fmt(avoided*v.blockShare/100,1)} episodes avoided per year`), tile(money(incBenefit),'Value of delay avoided',`blended VOT ${money(vot)}/h`), tile(fmt(vehHrsCost)+' veh-h / yr','Added travel time while active',`+${fmt(extraH*60,1)} min per trip at ${fmt(realised,0)} mph realised, ${fmt(vehActive)} trips/yr exposed`), tile(money(cost),'Cost of added travel time','only while a reduced limit is posted'), tile(money(incBenefit-cost),'Net annual travel-time effect', incBenefit-cost>=0?'positive':'negative at these inputs'));
  }
  root.append(tt);
  calc();

  root.append(h('div',{class:'card',style:'margin-top:14px'}, h('h3',{},'Reading these numbers'), h('ul',{class:'tight'},
    h('li',{},'The safety case is the primary justification; CDOT applies a conservative 20% reduction to crashes in the conditions the system addresses and still requires B/C > 1.0 (their examples: 2.34 weather-based on I-70 Vail Pass, 7.02 flow-based on I-25). Published evaluations of weather-responsive VSLs report reductions from roughly 10% to over 30%; the sensitivity table brackets that range.'),

})();
